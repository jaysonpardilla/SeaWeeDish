name: frontend
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.3.0
  camera: ^0.10.5+5
  permission_handler: ^12.0.1
  image_picker: ^1.0.7
  image: ^4.1.0
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.4.10
  http: ^0.13.6
  shared_preferences: ^2.0.15
  js: ^0.7.1
  flutter_map: ^4.0.0
  latlong2: ^0.8.1
  geolocator: ^11.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Itim
      fonts:
        - asset: assets/fonts/Itim-Regular.ttf
  
  assets:
    - lib/assets/philippine_seaweeds_50.json
    - lib/assets/images/seaweeds-images/
    - lib/assets/images/
    - lib/assets/onboarding/
    - assets/fonts/ 
    - lib/assets/recipes/
    
flutter_native_splash:
  color: "#ffffff"
  android: true
  ios: true
  fullscreen: true
  image: lib/assets/images/app_icon_splash.png
  android_gravity: center
  ios_content_mode: center
  web_image_mode: cover

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/app_icon.png" 

